[YouTube-Morphe]
enabled = true
app-name = "YouTube"
cli-source = "MorpheApp/morphe-cli"
patches-source = "MorpheApp/morphe-patches"
rv-brand = "Morphe"
build-mode = "both"
excluded-patches = """\
'Change package name'\
'Disable Play Store updates'\
'Custom branding'\
'Change header'\
'Enable debugging'\
'Loop video'\
'Play all'\
"""
patcher-args = """\
-e 'Theme'\
-OdarkThemeBackgroundColor=@android:color/black\
-OlightThemeBackgroundColor=@android:color/system_neutral1_100\
"""
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
arch = "arm64-v8a" 

